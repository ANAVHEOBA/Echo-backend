[package]
name = "echo_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.100"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = { version = "0.8.8", features = ["macros"] }
axum-extra = { version = "0.12.5", features = ["typed-header", "cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = "9"
oauth2 = "5.0.0"
rand = "0.9.2"
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.1", features = ["json"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.8", features = ["cors", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
claim = "0.5.0"
futures = "0.3"
criterion = { version = "0.8.1", features = ["html_reports"] }
fake = { version = "4.4.0", features = ["derive", "chrono", "uuid"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
mockall = "0.14.0"
once_cell = "1.21.3"
tempfile = "3.24.0"
test-case = "3.3.1"
tokio-test = "0.4.5"
tower = { version = "0.5.2", features = ["util"] }
wiremock = "0.6.5"

[[bench]]
name = "auth_benchmarks"
harness = false
